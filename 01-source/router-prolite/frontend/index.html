<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Pro-Lite</title>
<link rel="stylesheet" href="styles.css">
<script>
  (function () {
    try {
      var t = localStorage.getItem('prolite-theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  })();
</script>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M9 4h6l-1 6 4 3v2H6v-2l4-3-1-6z"/><path d="M12 15v5"/></symbol>
    <symbol id="i-pin-off" viewBox="0 0 24 24"><path d="M9 4h6l-1 6 4 3v2h-5"/><path d="M6 21l6-6"/><path d="M3 3l18 18"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-min" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-max" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="1.5"/></symbol>
    <symbol id="i-restore" viewBox="0 0 24 24"><rect x="7" y="4" width="13" height="13" rx="1.5"/><path d="M4 8v10.5A1.5 1.5 0 0 0 5.5 20H17"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 6.7"/><path d="M20 5v6h-6"/></symbol>
    <symbol id="i-power" viewBox="0 0 24 24"><path d="M12 3v9"/><path d="M6.3 7.3a8 8 0 1 0 11.4 0"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="2.5"/></symbol>
    <symbol id="i-eye-off" viewBox="0 0 24 24"><path d="M3 3l18 18"/><path d="M10.6 6.2A11 11 0 0 1 12 6c6.5 0 10 6 10 6a15 15 0 0 1-3 3.7"/><path d="M6.6 6.7A15 15 0 0 0 2 12s3.5 6 10 6a10 10 0 0 0 4-.8"/></symbol>
    <symbol id="i-wifi" viewBox="0 0 24 24"><path d="M2.5 9a15 15 0 0 1 19 0"/><path d="M5.5 12.5a10 10 0 0 1 13 0"/><path d="M8.5 16a5.5 5.5 0 0 1 7 0"/><circle cx="12" cy="19" r="1.2" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-cell" viewBox="0 0 24 24"><path d="M4 18v-3M9 18v-7M14 18V8M19 18V4"/></symbol>
    <symbol id="i-gauge" viewBox="0 0 24 24"><path d="M4.5 18a9 9 0 1 1 15 0"/><path d="M12 14l4-4"/><circle cx="12" cy="14" r="1.4" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.6-3 8.2-7 10-4-1.8-7-5.4-7-10V6l7-3z"/></symbol>
    <symbol id="i-proxy" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.4 2.3 3.6 5.2 3.6 8.5S14.4 18.2 12 20.5C9.6 18.2 8.4 15.3 8.4 12S9.6 5.8 12 3.5z"/></symbol>
    <symbol id="i-mwan" viewBox="0 0 24 24"><path d="M4 6h5l4 6 4-6h3"/><path d="M4 18h5l4-6"/><circle cx="3" cy="6" r="1.3"/><circle cx="3" cy="18" r="1.3"/><circle cx="21" cy="6" r="1.3"/></symbol>
    <symbol id="i-wan" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17"/><path d="M12 3.5c5 5 5 12 0 17M12 3.5c-5 5-5 12 0 17"/></symbol>
    <symbol id="i-dhcp" viewBox="0 0 24 24"><rect x="3.5" y="4" width="17" height="6" rx="1.5"/><rect x="3.5" y="14" width="17" height="6" rx="1.5"/><path d="M7 7h.01M7 17h.01"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5l11 7-11 7V5z"/></symbol>
    <symbol id="i-terminal" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l3 3-3 3M13 15h4"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 4v14M6 12l6 6 6-6"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 20V6M6 12l6-6 6 6"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></symbol>
    <symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="14" r="4"/><path d="M11 11l9-9M17 5l3 3M14 8l2 2"/></symbol>
    <symbol id="i-plug" viewBox="0 0 24 24"><path d="M9 3v5M15 3v5"/><path d="M6 8h12v3a6 6 0 0 1-12 0V8z"/><path d="M12 17v4"/></symbol>
    <symbol id="i-router" viewBox="0 0 24 24"><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 16.5h.01M11 16.5h.01"/><path d="M12 13V9"/><path d="M8.5 6.5a5 5 0 0 1 7 0"/><path d="M6 4a8.5 8.5 0 0 1 12 0"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4l9 16H3l9-16z"/><path d="M12 10v4M12 17.5h.01"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></symbol>
    <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2L5 14h6l-1 8 8-12h-6l1-8z"/></symbol>
  </defs>
</svg>

<div id="app" class="app">

  <!-- ============ Connect ============ -->
  <section id="connectView" class="view connect-view">
    <header class="dragbar" style="--wails-draggable:drag">
      <span class="brand-strip">PRO&nbsp;·&nbsp;LITE</span>
      <div class="win-actions" style="--wails-draggable:no-drag">
        <button type="button" class="reconnect-btn hidden" id="connectReconnectBtn" title="重新连接上次的设备">
          <svg class="i"><use href="#i-refresh"/></svg>重新连接
        </button>
        <button type="button" class="icon-btn" id="connectThemeBtn" title="切换主题">
          <svg class="i"><use href="#i-moon"/></svg>
        </button>
        <button type="button" class="icon-btn" data-win="min" title="最小化">
          <svg class="i"><use href="#i-min"/></svg>
        </button>
        <button type="button" class="icon-btn win-max" data-win="max" title="最大化">
          <svg class="i ico-max"><use href="#i-max"/></svg>
          <svg class="i ico-restore"><use href="#i-restore"/></svg>
        </button>
        <button type="button" class="icon-btn" id="connectCloseBtn" data-win="close" title="关闭">
          <svg class="i"><use href="#i-close"/></svg>
        </button>
      </div>
    </header>

    <div class="connect-body">
      <div class="brand-block">
        <div class="logo">
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <defs>
              <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#3B82F6"/>
                <stop offset="1" stop-color="#10B981"/>
              </linearGradient>
            </defs>
            <path d="M24 3l18 10.5v21L24 45 6 34.5v-21L24 3z" fill="none" stroke="url(#logoGrad)" stroke-width="1.6"/>
            <path d="M24 14v9M24 23l-7 5M24 23l7 5" stroke="url(#logoGrad)" stroke-width="1.7" stroke-linecap="round"/>
            <circle cx="24" cy="12.5" r="2.4" fill="#3B82F6"/>
            <circle cx="16" cy="29.5" r="2.4" fill="#10B981"/>
            <circle cx="32" cy="29.5" r="2.4" fill="#10B981"/>
          </svg>
        </div>
        <h1>Pro-Lite</h1>
        <p>OpenWrt · 桌面网络控制台</p>
      </div>

      <form id="connectForm" autocomplete="off">
        <div class="field-row">
          <div class="field grow">
            <label for="hostInput">主机</label>
            <input id="hostInput" spellcheck="false" placeholder="192.168.100.1">
          </div>
          <div class="field port">
            <label for="portInput">端口</label>
            <input id="portInput" inputmode="numeric" spellcheck="false" placeholder="22">
          </div>
        </div>
        <div class="field">
          <label for="userInput">用户名</label>
          <input id="userInput" spellcheck="false" placeholder="root">
        </div>

        <div class="field">
          <label>认证方式</label>
          <div class="seg four" id="authSeg">
            <button type="button" data-auth="none"><svg class="i"><use href="#i-bolt"/></svg>免密</button>
            <button type="button" data-auth="agent"><svg class="i"><use href="#i-plug"/></svg>Agent</button>
            <button type="button" data-auth="key"><svg class="i"><use href="#i-key"/></svg>私钥</button>
            <button type="button" data-auth="password"><svg class="i"><use href="#i-lock"/></svg>密码</button>
          </div>
        </div>

        <div class="auth-pane" id="pane-none">
          <p class="hint">OpenWrt 默认允许 root 免密登录（Dropbear none 认证），无需任何密钥或密码。</p>
        </div>

        <div class="auth-pane hidden" id="pane-agent">
          <p class="hint">使用系统 SSH Agent 中已加载的密钥（ssh-add）。</p>
        </div>

        <div class="auth-pane hidden" id="pane-key">
          <div class="field">
            <label for="keyPathInput">私钥文件</label>
            <div class="row">
              <input id="keyPathInput" spellcheck="false" placeholder="~/.ssh/id_ed25519">
              <button type="button" class="btn ghost" id="pickKeyBtn">浏览</button>
            </div>
          </div>
          <div class="field">
            <label for="passphraseInput">私钥口令（可选）</label>
            <input id="passphraseInput" type="password" autocomplete="new-password" placeholder="加密私钥才需要">
          </div>
        </div>

        <div class="auth-pane hidden" id="pane-password">
          <div class="field">
            <label for="passwordInput">密码</label>
            <input id="passwordInput" type="password" autocomplete="new-password" placeholder="仅用于本次连接，不会保存">
          </div>
        </div>

        <label class="check-row">
          <input type="checkbox" id="rememberInput">
          <span>记住连接信息（密码永不落盘）</span>
        </label>

        <button type="submit" class="btn primary connect-btn" id="connectBtn">
          <span class="btn-label">连接路由器</span>
          <svg class="i spin-icon hidden"><use href="#i-refresh"/></svg>
        </button>

        <div class="error-box hidden" id="connectError"></div>
        <button type="button" class="link-btn hidden" id="resetFpBtn">重置已保存的主机指纹</button>
      </form>

      <footer class="connect-foot">
        <span id="connectPlatform">desktop</span>
        <span class="mono" id="connectVersion">v0.1.0</span>
        <button type="button" class="link-btn" id="offlineMarketBtn" title="不连接设备也能浏览索引">插件市场（离线浏览）</button>
      </footer>
    </div>
  </section>

  <!-- ============ Main ============ -->
  <section id="mainView" class="view main-view hidden">
    <header class="topbar" style="--wails-draggable:drag">
      <div class="top-left">
        <span class="status-dot" id="connDot"></span>
        <span class="host-name" id="hostName">Pro-Lite</span>
        <span class="link-badge mono" id="linkBadge">--</span>
      </div>
      <div class="top-actions" style="--wails-draggable:no-drag">
        <button type="button" class="reconnect-btn hidden" id="reconnectBtn" title="重新连接上次的设备">
          <svg class="i"><use href="#i-refresh"/></svg>重新连接
        </button>
        <button type="button" class="console-btn" id="proBtn" title="打开控制中心 (Ctrl+K)">
          <svg class="i"><use href="#i-gauge"/></svg>控制中心
        </button>
        <button type="button" class="icon-btn" id="themeBtn" title="切换主题">
          <svg class="i"><use href="#i-moon"/></svg>
        </button>
        <button type="button" class="icon-btn" id="pinBtn" title="窗口置顶">
          <svg class="i"><use href="#i-pin"/></svg>
        </button>
        <button type="button" class="icon-btn" data-win="min" title="最小化">
          <svg class="i"><use href="#i-min"/></svg>
        </button>
        <button type="button" class="icon-btn win-max" data-win="max" title="最大化">
          <svg class="i ico-max"><use href="#i-max"/></svg>
          <svg class="i ico-restore"><use href="#i-restore"/></svg>
        </button>
        <button type="button" class="icon-btn" id="closeBtn" data-win="close" title="关闭">
          <svg class="i"><use href="#i-close"/></svg>
        </button>
      </div>
    </header>

    <main class="main-scroll" id="mainScroll">
      <section class="card wan-card">
        <div class="wan-top">
          <span class="proto-pill" id="wanProto">WAN</span>
          <span class="wan-status" id="wanStatus"><i></i>UP</span>
          <span class="wan-ip mono" id="wanIP">—</span>
          <button type="button" class="icon-xs" id="copyIPBtn" title="复制公网 IP">
            <svg class="i"><use href="#i-copy"/></svg>
          </button>
          <button type="button" class="icon-xs" id="maskIPBtn" title="IP 脱敏">
            <svg class="i"><use href="#i-eye"/></svg>
          </button>
          <div class="wan-right mono">
            <span class="metric" id="latencyMetric"><i class="dot"></i>-- ms</span>
            <span id="uptimeMetric">UP --</span>
          </div>
        </div>
        <div class="rates">
          <div class="rate rx">
            <div class="rate-label"><svg class="i"><use href="#i-down"/></svg>RX</div>
            <div class="rate-val mono" id="rxValue">0 B/s</div>
          </div>
          <div class="rate tx">
            <div class="rate-label"><svg class="i"><use href="#i-up"/></svg>TX</div>
            <div class="rate-val mono" id="txValue">0 B/s</div>
          </div>
        </div>
        <div class="topo-wrap" id="topoWrap"></div>
      </section>

      <section class="card hw-card">
        <div class="hw-grid">
          <div class="hw-cell">
            <div class="hw-head"><span>CPU</span><span class="hw-value mono" id="cpuValue">--</span></div>
            <div class="bar"><i id="cpuBar"></i></div>
            <div class="hw-sub mono" id="cpuSub">-- 核</div>
          </div>
          <div class="hw-cell">
            <div class="hw-head"><span>RAM</span><span class="hw-value mono" id="ramValue">--</span></div>
            <div class="bar"><i id="ramBar"></i></div>
            <div class="hw-sub mono" id="ramSub">-- / --</div>
          </div>
          <div class="hw-cell" id="tempCell">
            <div class="hw-head"><span>TEMP</span><span class="hw-value mono" id="tempValue">--</span></div>
            <div class="bar"><i id="tempBar"></i></div>
            <div class="hw-sub mono" id="tempSub">SoC</div>
          </div>
        </div>
      </section>

      <section class="card dev-card" id="devCard">
        <header class="card-head">
          <span class="card-title">设备与插件</span>
          <span class="grow"></span>
        </header>
        <div id="devSummary" class="dev-summary"></div>
        <div id="pluginChips" class="plugin-chips"></div>
      </section>

      <section class="tiles" id="tilesGrid"></section>

      <section class="card clients-card" id="clientsCard">
        <header class="card-head">
          <span class="card-title">活跃终端</span>
          <span class="count-chip mono" id="clientCount">0</span>
          <span class="grow"></span>
          <span class="head-hint">点击行展开</span>
        </header>
        <div id="clientList" class="client-list"></div>
      </section>

      <div class="conn-banner hidden" id="connBanner"></div>
    </main>
  </section>

  <!-- ============ Cellular detail ============ -->
  <section id="cellView" class="view cell-view hidden" aria-hidden="true">
    <header class="topbar cell-top" style="--wails-draggable:drag">
      <button type="button" class="icon-btn" id="cellBack" title="返回" style="--wails-draggable:no-drag">
        <svg class="i"><use href="#i-back"/></svg>
      </button>
      <div class="top-left">
        <span class="host-name">蜂窝网络</span>
        <span class="link-badge mono" id="cellBadge">--</span>
      </div>
      <div class="top-actions" style="--wails-draggable:no-drag">
        <button type="button" class="btn mini ghost" id="cellRefresh">刷新</button>
        <button type="button" class="icon-btn" data-win="min" title="最小化">
          <svg class="i"><use href="#i-min"/></svg>
        </button>
        <button type="button" class="icon-btn win-max" data-win="max" title="最大化">
          <svg class="i ico-max"><use href="#i-max"/></svg>
          <svg class="i ico-restore"><use href="#i-restore"/></svg>
        </button>
        <button type="button" class="icon-btn" data-win="close" title="关闭">
          <svg class="i"><use href="#i-close"/></svg>
        </button>
      </div>
    </header>
    <main class="main-scroll cell-scroll" id="cellScroll">
      <div id="cellBody"></div>
    </main>
  </section>

  <!-- ============ Lab ============ -->
  <section id="labView" class="view lab-view" aria-hidden="true">
    <header class="topbar lab-top" style="--wails-draggable:drag">
      <button type="button" class="icon-btn" id="labBack" title="返回" style="--wails-draggable:no-drag">
        <svg class="i"><use href="#i-back"/></svg>
      </button>
      <div class="lab-title">
        <span>控制中心</span>
        <span class="crumb mono" id="labCrumb">—</span>
      </div>
      <div class="top-actions" style="--wails-draggable:no-drag">
        <button type="button" class="icon-btn" id="labRefreshBtn" title="刷新">
          <svg class="i"><use href="#i-refresh"/></svg>
        </button>
        <button type="button" class="icon-btn" id="labDisconnectBtn" title="断开连接">
          <svg class="i"><use href="#i-power"/></svg>
        </button>
        <button type="button" class="icon-btn" data-win="min" title="最小化">
          <svg class="i"><use href="#i-min"/></svg>
        </button>
        <button type="button" class="icon-btn win-max" data-win="max" title="最大化">
          <svg class="i ico-max"><use href="#i-max"/></svg>
          <svg class="i ico-restore"><use href="#i-restore"/></svg>
        </button>
        <button type="button" class="icon-btn" data-win="close" title="关闭">
          <svg class="i"><use href="#i-close"/></svg>
        </button>
      </div>
    </header>
    <div class="lab-tabs">
      <button type="button" data-labtab="console" class="active">
        <svg class="i"><use href="#i-terminal"/></svg>控制台
      </button>
      <button type="button" data-labtab="market" title="浏览并安装插件">
        <svg class="i"><use href="#i-plug"/></svg>插件市场
      </button>
      <button type="button" data-labtab="tools">
        <svg class="i"><use href="#i-bolt"/></svg>工具
      </button>
    </div>
    <div class="lab-scroll" id="labScroll">
      <div id="labContent"></div>
    </div>
  </section>

  <div class="toasts" id="toasts"></div>
</div>

<script src="market-i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
